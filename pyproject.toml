[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blow91outp-rlrsr_jd238"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告强化学习研究员·提示注入的跨轮传播相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "blow91outp" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://blow91outp.github.io"
Repository = "https://github.com/blow91outp/rlrsr_jd238"
Issues = "https://github.com/blow91outp/rlrsr_jd238/issues"

[project.scripts]
rlrsr_jd238 = "rlrsr_jd238:main"

[tool.setuptools]
py-modules = ["rlrsr_jd238"]
